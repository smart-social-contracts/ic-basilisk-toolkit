# Deploy Website — build and deploy the basilisk landing page to IC mainnet.
#
# Triggered manually or automatically on pushes to main that touch website/.
# Canister IDs are read from website/.icp/data (committed) so every run targets
# the same canister instead of creating a new one. Deployed with icp-cli.

name: Deploy Website

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "website/**"
            - ".github/workflows/deploy-website.yml"

env:
    NETWORK: ic

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install icp-cli + ic-wasm
              run: npm install -g @icp-sdk/icp-cli@0.2.7 @icp-sdk/ic-wasm

            - name: Import deploy identity
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
              run: |
                  if [ -z "$IC_IDENTITY_PEM" ]; then
                      echo "::error::IC_IDENTITY_PEM secret is not set."; exit 1
                  fi
                  umask 077
                  printf '%s' "$IC_IDENTITY_PEM" > /tmp/ci-identity.pem
                  icp identity import ci-deploy --from-pem /tmp/ci-identity.pem --storage plaintext
                  rm -f /tmp/ci-identity.pem
                  echo "Deploy principal: $(icp identity principal --identity ci-deploy)"

            - name: Deploy website canister
              working-directory: website
              run: |
                  if [ ! -f .icp/data/mappings/ic.ids.json ]; then
                      echo "::error::website/.icp/data/mappings/ic.ids.json is missing. Run 'icp deploy -e ic basilisk_website' locally once and commit it."
                      exit 1
                  fi
                  icp deploy basilisk_website -e "$NETWORK" --identity ci-deploy -y
                  CANISTER_ID=$(jq -r '.basilisk_website' .icp/data/mappings/ic.ids.json)
                  echo "CANISTER_ID=$CANISTER_ID" >> $GITHUB_ENV
                  echo "Deployed: https://$CANISTER_ID.icp0.io"

            - name: Summary
              run: |
                  echo "## Website Deployment" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- **Canister**: [\`$CANISTER_ID\`](https://dashboard.internetcomputer.org/canister/$CANISTER_ID)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Raw URL**: [https://$CANISTER_ID.icp0.io](https://$CANISTER_ID.icp0.io)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Custom domain**: [https://ic-basilisk.tech](https://ic-basilisk.tech) _(after domain migration)_" >> $GITHUB_STEP_SUMMARY

            - name: Remove identity material
              if: always()
              run: rm -f /tmp/ci-identity.pem
