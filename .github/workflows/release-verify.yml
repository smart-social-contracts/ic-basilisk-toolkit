name: Verify release signature

# A published v* release must carry checksums.txt signed with the release key.
# Only then are its wheel and sdist (the signed bytes) uploaded to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    permissions:
      contents: write
    uses: smart-social-contracts/.github/.github/workflows/verify-release.yml@770dd2d252a20fd8f17dbab3c8dc21ae57678ea9 # main 2026-10-07
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      fingerprint: 6B7B038DEB77849F1F615E67CA38831314D6AA09
      revert_on_failure: ${{ github.event_name == 'release' }}

  pypi:
    needs: verify
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the signed wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist \
            --pattern '*.whl' --pattern 'ic_basilisk_toolkit-*.tar.gz'
          ls -l dist

      # Trusted Publishing (OIDC): pypi.org trusts release-verify.yml, no token.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
