# Cut a release: bump the version, build, tag, and attach the wheel, sdist and
# checksums.txt to a draft release. It is published (and only then uploaded to
# PyPI, by release-verify.yml) after checksums.txt is signed with the release
# key: smart-social-contracts/.github scripts/sign-release.sh.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.6.0). Leave empty to use the bump level.'
        required: false
        type: string
      bump:
        description: 'Bump level (ignored if version is set)'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: pip install build twine setuptools wheel bump2version

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ inputs.version }}" ]; then
            OLD_VERSION=$(grep 'current_version' .bumpversion.cfg | head -1 | cut -d= -f2 | tr -d ' ')
            sed -i "s/$OLD_VERSION/${{ inputs.version }}/g" setup.py pyproject.toml ic_basilisk_toolkit/__init__.py .bumpversion.cfg
          else
            bump2version ${{ inputs.bump }} --no-commit --no-tag
          fi
          NEW_VERSION=$(grep 'current_version' .bumpversion.cfg | head -1 | cut -d= -f2 | tr -d ' ')
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $NEW_VERSION"

      - name: Verify version consistency
        run: |
          SETUP_VERSION=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read()).group(1))")
          BUMP_VERSION=$(grep 'current_version' .bumpversion.cfg | head -1 | cut -d= -f2 | tr -d ' ')
          echo "setup.py version: $SETUP_VERSION"
          echo ".bumpversion.cfg version: $BUMP_VERSION"
          if [ "$SETUP_VERSION" != "$BUMP_VERSION" ]; then
            echo "ERROR: Version mismatch between setup.py ($SETUP_VERSION) and .bumpversion.cfg ($BUMP_VERSION)"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Commit and tag
        env:
          TAG: v${{ steps.bump.outputs.version }}
        run: |
          git add setup.py pyproject.toml ic_basilisk_toolkit/__init__.py .bumpversion.cfg
          git commit -m "Bump version to ${TAG#v}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main "$TAG"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.bump.outputs.version }}
        run: |
          cd dist
          { echo "# SHA-256 checksums for release assets"; sha256sum *; } > ../checksums.txt
          mv ../checksums.txt .
          cat checksums.txt
          gh release create "$TAG" --draft --title "$TAG" --generate-notes *
