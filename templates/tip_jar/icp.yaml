# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.1.0/docs/schemas/icp-yaml-schema.json
#
# Tip Jar template — deployed with icp-cli (dfx is not used).
# The Basilisk backend WASM is built out-of-band (see `make build`) and
# installed via the prebuilt recipe; the vanilla frontend assets are served
# by the asset-canister recipe.

canisters:
  - name: tip_jar_backend
    recipe:
      type: "@dfinity/prebuilt@v2.0.0"
      configuration:
        path: .basilisk/tip_jar_backend/tip_jar_backend.wasm
        shrink: true
        compress: true

  - name: tip_jar_frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.0"
      configuration:
        dir: src/frontend/assets
